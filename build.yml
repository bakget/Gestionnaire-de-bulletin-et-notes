              base64 -d /tmp/key.b64 > /tmp/key.enc
            fi
            mkdir -p ~/.android
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in /tmp/key.enc -out ~/.android/debug.keystore -pass env:SIGNING_PASSPHRASE || { echo "::error::Phrase secrète incorrecte (secret SIGNING_PASSPHRASE)."; exit 1; }
          fi

      - name: Ajouter la plateforme Android
        run: npx cap add android

      - name: Plugin d'impression Android (aperçu et impression directe)
        run: |
          APPID=$(grep -o '"appId" *: *"[^"]*"' capacitor.config.json | sed 's/.*: *"\(.*\)"/\1/')
          DIR="android/app/src/main/java/$(echo "$APPID" | tr . /)"
          mkdir -p "$DIR"
          cat > "$DIR/PrintPlugin.java" <<EOF
          package $APPID;

          import android.content.Context;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.webkit.WebView;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "AppPrint")
          public class PrintPlugin extends Plugin {
              @PluginMethod
              public void print(final PluginCall call) {
                  final String name = call.getString("name", "Document");
                  getActivity().runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              PrintManager pm = (PrintManager) getActivity().getSystemService(Context.PRINT_SERVICE);
                              WebView wv = getBridge().getWebView();
                              PrintDocumentAdapter adapter = wv.createPrintDocumentAdapter(name);
                              pm.print(name, adapter, new PrintAttributes.Builder().build());
                              call.resolve();
                          } catch (Exception e) {
                              call.reject(String.valueOf(e.getMessage()));
                          }
                      }
                  });
              }
          }
          EOF
          cat > "$DIR/MainActivity.java" <<EOF
          package $APPID;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(PrintPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF
          ls -la "$DIR"

      - name: Icône de l'application (logo SMART BNEPP)
        run: |
          set -e
          SRC=/tmp/logo.png
          grep -o 'rel="apple-touch-icon"[^>]*base64,[A-Za-z0-9+/=]*' www/index.html | head -1 | sed 's/.*base64,//' | base64 -d > "$SRC"
          RES=android/app/src/main/res
          for d in "mdpi 48 108" "hdpi 72 162" "xhdpi 96 216" "xxhdpi 144 324" "xxxhdpi 192 432"; do
            set -- $d
            D=$1; S=$2; F=$3
            mkdir -p "$RES/mipmap-$D"
            L=$((S*80/100)); C=$((S/2)); P=$((F*66/100))
            convert -size ${S}x${S} xc:'#0a2a6b' \( "$SRC" -resize ${L}x${L} \) -gravity center -composite "$RES/mipmap-$D/ic_launcher.png"
            convert -size ${S}x${S} xc:none -fill '#0a2a6b' -draw "circle $C,$C $C,0" \( "$SRC" -resize ${L}x${L} \) -gravity center -composite "$RES/mipmap-$D/ic_launcher_round.png"
            convert -size ${F}x${F} xc:none \( "$SRC" -resize ${P}x${P} \) -gravity center -composite "$RES/mipmap-$D/ic_launcher_foreground.png"
          done
          mkdir -p "$RES/values" "$RES/mipmap-anydpi-v26"
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#0A2A6B</color>\n</resources>\n' > "$RES/values/ic_launcher_background.xml"
          for n in ic_launcher ic_launcher_round; do
            printf '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/ic_launcher_background"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n' > "$RES/mipmap-anydpi-v26/$n.xml"
          done
          ls -la "$RES"/mipmap-xxxhdpi

      - name: Synchroniser
        run: npx cap sync android

      - name: Numéro de version Android
        run: |
          sed -i "s/versionCode 1/versionCode ${{ steps.ver.outputs.code }}/; s/versionName \"1.0\"/versionName \"${{ steps.ver.outputs.version }}\"/" android/app/build.gradle
          grep -n "version" android/app/build.gradle | head

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Préparer les fichiers à publier
        run: |
          V="${{ steps.ver.outputs.version }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "SMART-BNEPP-$V.apk"
          zip -qr "SMART-BNEPP-$V-projet.zip" . -x "node_modules/*" "android/*" ".git/*" "*.apk" "*.zip" "*-hors-ligne.html"

      - name: Conserver l'APK
        uses: actions/upload-artifact@v4
        with:
          name: SMART-BNEPP-${{ steps.ver.outputs.version }}
          path: SMART-BNEPP-${{ steps.ver.outputs.version }}.apk

      - name: Publier la version (liens de téléchargement)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: SMART BNEPP ${{ steps.ver.outputs.version }}
          make_latest: true
          files: |
            SMART-BNEPP-${{ steps.ver.outputs.version }}.apk
            SMART-BNEPP-${{ steps.ver.outputs.version }}-projet.zip
            SMART-BNEPP-${{ steps.ver.outputs.version }}-hors-ligne.html

      - name: Préparer la version suivante
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "${{ steps.ver.outputs.next }}" > version.txt
          git add version.txt
          git commit -m "Prochaine version ${{ steps.ver.outputs.next }}" || true
          git push || true

  pages:
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que GitHub Pages est activé
        id: chk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" > /dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages non activé (Settings > Pages > Source : GitHub Actions) : site ignoré, l'APK n'est pas concerné."
          fi

      - name: Préparer le site (application installable, hors ligne)
        if: steps.chk.outputs.enabled == 'true'
        run: |
          [ -f package.json ] || cat > package.json <<'EOF'
          {
            "name": "bulletins-notes",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "libs": "node scripts/copy-libs.js"
            },
            "dependencies": {
              "@capacitor/android": "^6.2.0",
              "@capacitor/cli": "^6.2.0",
              "@capacitor/core": "^6.2.0",
              "@capacitor/filesystem": "^6.0.2",
              "@capacitor/share": "^6.0.3",
              "html2canvas": "1.4.1",
              "jspdf": "2.5.1",
              "jspdf-autotable": "3.8.2",
              "@capacitor/browser": "^6.0.3",
              "pdfjs-dist": "3.11.174"
            }
          }
          EOF
          [ -f capacitor.config.json ] || cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.toto.bulletins",
            "appName": "SMART BNEPP",
            "webDir": "www"
          }
          EOF
          if [ ! -f www/index.html ]; then
            if [ -f index.html ]; then mkdir -p www; cp index.html www/index.html; echo "index.html copié dans www/"
            else echo "::error::index.html introuvable : ajoutez index.html à la racine du dépôt"; exit 1; fi
          fi
          V="V2.0.0"
          if [ -f version.txt ]; then V=$(tr -d ' \r\n' < version.txt); fi
          npm install --ignore-scripts --no-audit --no-fund
          mkdir -p www/libs
          cp node_modules/jspdf/dist/jspdf.umd.min.js node_modules/jspdf-autotable/dist/jspdf.plugin.autotable.min.js node_modules/html2canvas/dist/html2canvas.min.js node_modules/pdfjs-dist/build/pdf.min.js node_modules/pdfjs-dist/build/pdf.worker.min.js www/libs/
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js#libs/jspdf.umd.min.js#; s#https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js#libs/jspdf.plugin.autotable.min.js#; s#https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js#libs/html2canvas.min.js#; s#https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js#libs/pdf.min.js#' www/index.html
          grep -q 'config.js' www/index.html || sed -i 's#</head>#<script src="config.js"></script></head>#' www/index.html
          printf 'window.APP_CFG={version:"%s",repo:"%s",branch:"%s",annonce:"https://raw.githubusercontent.com/%s/%s/annonce.json",archives:"https://raw.githubusercontent.com/%s/%s/archives.json",release:"https://github.com/%s/releases/latest"};\n' \
            "$V" "${{ github.repository }}" "${{ github.ref_name }}" \
            "${{ github.repository }}" "${{ github.ref_name }}" "${{ github.repository }}" "${{ github.ref_name }}" "${{ github.repository }}" > www/config.js
          grep -o 'rel="apple-touch-icon"[^>]*base64,[A-Za-z0-9+/=]*' www/index.html | head -1 | sed 's/.*base64,//' | base64 -d > www/icon-512.png
          convert www/icon-512.png -resize 192x192 www/icon-192.png || cp www/icon-512.png www/icon-192.png
          printf '{"name":"SMART BNEPP","short_name":"BNEPP","start_url":"./","scope":"./","display":"standalone","background_color":"#0b6b3a","theme_color":"#0b6b3a","icons":[{"src":"icon-192.png","sizes":"192x192","type":"image/png"},{"src":"icon-512.png","sizes":"512x512","type":"image/png"}]}\n' > www/manifest.webmanifest
          sed -i 's#</head>#<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="\#0b6b3a"></head>#; s#</body>#<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js")</script></body>#' www/index.html
          LIST=$(cd www && find . -type f ! -name sw.js | sed 's#^\./##' | sed 's#.*#"&"#' | paste -sd, -)
          echo "const C=\"bn-${{ github.run_number }}\",A=[\"./\",$LIST];" > www/sw.js
          cat >> www/sw.js <<'EOF'
          self.addEventListener("install",e=>e.waitUntil(caches.open(C).then(c=>c.addAll(A)).then(()=>self.skipWaiting())));
          self.addEventListener("activate",e=>e.waitUntil(caches.keys().then(k=>Promise.all(k.filter(x=>x!=C).map(x=>caches.delete(x)))).then(()=>clients.claim())));
          self.addEventListener("fetch",e=>{if(e.request.method!="GET")return;if(new URL(e.request.url).origin!=location.origin)return;e.respondWith(caches.match(e.request,{ignoreSearch:true}).then(r=>r||fetch(e.request).then(x=>{const y=x.clone();caches.open(C).then(c=>c.put(e.request,y));return x}).catch(()=>caches.match("index.html"))))});
          EOF
          touch www/.nojekyll

      - uses: actions/configure-pages@v5
        if: steps.chk.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.chk.outputs.enabled == 'true'
        with:
          path: www
      - id: dep
        if: steps.chk.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
