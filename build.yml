name: Build APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Numéro de version (ex. V2.0.1). Laisser vide = version automatique (fichier version.txt)"
        required: false
        default: ""
  push:
    branches: [main, master]
    paths-ignore: [version.txt, annonce.json, archives.json, "archives/**", README.md]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Préparer le projet (fichiers manquants créés automatiquement)
        run: |
          [ -f package.json ] || cat > package.json <<'EOF'
          {
            "name": "bulletins-notes",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "libs": "node scripts/copy-libs.js"
            },
            "dependencies": {
              "@capacitor/android": "^6.2.0",
              "@capacitor/cli": "^6.2.0",
              "@capacitor/core": "^6.2.0",
              "@capacitor/filesystem": "^6.0.2",
              "@capacitor/share": "^6.0.3",
              "html2canvas": "1.4.1",
              "jspdf": "2.5.1",
              "jspdf-autotable": "3.8.2",
              "@capacitor/browser": "^6.0.3",
              "pdfjs-dist": "3.11.174"
            }
          }
          EOF
          [ -f capacitor.config.json ] || cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.toto.bulletins",
            "appName": "SMART BNEPP",
            "webDir": "www"
          }
          EOF
          if [ ! -f www/index.html ]; then
            if [ -f index.html ]; then mkdir -p www; cp index.html www/index.html; echo "index.html copié dans www/"
            else echo "::error::index.html introuvable : ajoutez index.html à la racine du dépôt"; exit 1; fi
          fi

      - name: Déterminer la version
        id: ver
        env:
          INPUT_V: ${{ github.event.inputs.version }}
        run: |
          V="$INPUT_V"
          if [ -z "$V" ]; then
            if [ -f version.txt ]; then V=$(tr -d ' \r\n' < version.txt); else V="V2.0.0"; fi
          fi
          if ! echo "$V" | grep -Eq '^V[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Numéro de version invalide ($V). Format attendu : V2.0.1 (vérifiez version.txt)"
            exit 1
          fi
          IFS=. read -r MA MI PA <<< "${V#V}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "code=$((MA*10000+MI*100+PA))" >> "$GITHUB_OUTPUT"
          echo "next=V${MA}.${MI}.$((PA+1))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Application hors ligne (bibliothèques PDF intégrées)
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p www/libs
          cp node_modules/jspdf/dist/jspdf.umd.min.js node_modules/jspdf-autotable/dist/jspdf.plugin.autotable.min.js node_modules/html2canvas/dist/html2canvas.min.js node_modules/pdfjs-dist/build/pdf.min.js node_modules/pdfjs-dist/build/pdf.worker.min.js www/libs/
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js#libs/jspdf.umd.min.js#; s#https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js#libs/jspdf.plugin.autotable.min.js#; s#https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js#libs/html2canvas.min.js#; s#https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js#libs/pdf.min.js#' www/index.html
          grep -q 'config.js' www/index.html || sed -i 's#</head>#<script src="config.js"></script></head>#' www/index.html
          printf 'window.APP_CFG={version:"%s",repo:"%s",branch:"%s",annonce:"https://raw.githubusercontent.com/%s/%s/annonce.json",archives:"https://raw.githubusercontent.com/%s/%s/archives.json",release:"https://github.com/%s/releases/latest"};\n' \
            "$V" "${{ github.repository }}" "${{ github.ref_name }}" \
            "${{ github.repository }}" "${{ github.ref_name }}" "${{ github.repository }}" "${{ github.ref_name }}" "${{ github.repository }}" > www/config.js
          cat www/config.js

      - name: Créer le fichier HTML autonome (hors ligne total)
        env:
          OUT: SMART-BNEPP-${{ steps.ver.outputs.version }}-hors-ligne.html
        run: |
          python3 - <<'PY'
          import re, os, json
          s = open('www/index.html', encoding='utf-8').read()
          def esc(t):
              return t.replace('</script', '<\\/script').replace('<!--', '<\\!--')
          def rep(m):
              p = 'www/' + m.group(1)
              if os.path.exists(p):
                  return '<script>' + esc(open(p, encoding='utf-8').read()) + '</script>'
              return m.group(0)
          s = re.sub(r'<script src="([^"]+\.js)"></script>', rep, s)
          w = json.dumps(open('www/libs/pdf.worker.min.js', encoding='utf-8').read())
          s = s.replace('</head>', '<script>window.PDFW_TXT=' + esc(w) + ';</script></head>', 1)
          open(os.environ['OUT'], 'w', encoding='utf-8').write(s)
          print('fichier autonome :', os.path.getsize(os.environ['OUT']), 'octets')
          PY

      - name: Clé de signature (mises à jour sans désinstaller)
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          if [ -z "$SIGNING_PASSPHRASE" ]; then
            echo "::warning::Secret SIGNING_PASSPHRASE absent : APK signé avec une clé temporaire. Créez ce secret (Settings > Secrets and variables > Actions) avant de distribuer l'application, sinon les futures mises à jour demanderont de désinstaller l'ancienne version."
          else
            if [ -f signing-key.b64 ]; then base64 -d signing-key.b64 > /tmp/key.enc
            elif [ -f signing/debug.keystore.enc ]; then cp signing/debug.keystore.enc /tmp/key.enc
            else
