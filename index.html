const SUB={cp:["Écriture","Copie","Orthographe","Expression écrite","Mathématiques","EDHC","Chant / Dessin","Dictée / Graphisme"],cm:["Étude de texte","Éveil au milieu","Dictée","Mathématiques"]};
const NM={cp:"CP",cm:"CE - CM"};
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S,K="cp",C=1,T="home",BID=null,SORT=false;
const blank=()=>({id:"",nom:"",sexe:"",abs:{},n:{},ov:{}});
const def=()=>({set:{ecole:"",annee:"",iepp:"IEPP GUIGLO",bp:"",email:"",dir:"",dt:"",cp:{cl:"CP1",m:"",t:""},cm:{cl:"CM1",m:"",t:""}},cp:Array.from({length:10},blank),cm:Array.from({length:10},blank)});
/* stockage IndexedDB + secours localStorage */
let db;const idb=()=>new Promise(r=>{try{const q=indexedDB.open("bulletins",2);q.onupgradeneeded=()=>{const d=q.result;if(!d.objectStoreNames.contains("k"))d.createObjectStore("k");if(!d.objectStoreNames.contains("docs"))d.createObjectStore("docs")};q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}});
const dbGet=()=>new Promise(r=>{if(!db){try{r(JSON.parse(localStorage.getItem("bul")))}catch(e){r(null)}return}const q=db.transaction("k").objectStore("k").get("S");q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)});
let tm;const save=()=>{clearTimeout(tm);tm=setTimeout(()=>{try{if(db)db.transaction("k","readwrite").objectStore("k").put(S,"S");else localStorage.setItem("bul",JSON.stringify(S))}catch(e){}},300)};
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",3500)}
const named=k=>S[k].filter(s=>s.nom.trim());
const fm=x=>x==null?"":(Math.round(x*100)/100).toString().replace(".",",");
const num=v=>{v=String(v).replace(",",".").trim();if(v==="")return null;const x=parseFloat(v);return isNaN(x)?null:Math.max(0,Math.min(10,x))};
function calc(s,k,c){const a=(s.n[c]||[]).slice(0,SUB[k].length).filter(x=>x!=null&&x!=="");const tot=a.reduce((p,x)=>p+x,0);return{has:a.length>0,tot:a.length?tot:null,moy:a.length?tot/a.length:null}}
const appr=m=>m==null?"":m>=10?"Très bien":m>=8?"Bien":m>=6?"Assez bien":m>=5?"Passable":m>=3?"Insuffisant":"Faible";
function ranks(k,f){const l=named(k).map(s=>({s,m:f(s)})).filter(x=>x.m!=null).sort((a,b)=>b.m-a.m);const r={};l.forEach(x=>r[x.s.id]=1+l.filter(y=>y.m>x.m).length);return{r,n:l.length}}
const rk=n=>n?n+(n==1?"er":"e"):"";
function ann(s,k){const c=[1,2,3,4].map(i=>s.ov[i]!=null&&s.ov[i]!==""?num(s.ov[i]):calc(s,k,i).moy);const has=c.some(x=>x!=null);const v=c.map(x=>x||0);const tot=v[0]+v[1]+v[2]+v[3]*2,moy=tot/5;return{c,has,tot:has?tot:null,moy:has?moy:null,dfa:!has?"":moy<5?"REDOUBLE":moy>=10?"Très-Bien":"ADMIS"}}
function genId(k){let id;const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";do{id=(k=="cp"?"CP":"CM")+"-"+Array.from({length:6},()=>A[Math.random()*A.length|0]).join("")}while(["cp","cm"].some(q=>S[q].some(s=>s.id==id)));return id}
function stats(k,c){const L=named(k),o={};["M","F"].forEach(x=>{const g=L.filter(s=>s.sexe==x),p=g.filter(s=>!s.abs[c]&&calc(s,k,c).has);const ad=p.filter(s=>calc(s,k,c).moy>=5).length;o[x]={i:g.length,p:p.length,a:g.length-p.length,ad,pc:p.length?ad/p.length*100:null}});const t={};["i","p","a","ad"].forEach(f=>t[f]=o.M[f]+o.F[f]);t.pc=t.p?t.ad/t.p*100:null;const ms=L.filter(s=>!s.abs[c]&&calc(s,k,c).has).map(s=>calc(s,k,c).moy);return{o,t,max:ms.length?Math.max(...ms):null,min:ms.length?Math.min(...ms):null,avg:ms.length?ms.reduce((a,b)=>a+b,0)/ms.length:null}}

const TABS=[["home","🏠 Accueil"],["adm","🔑 Admin"],["eval","📝 Évaluation"],["ann","📊 Moy. annuelle"],["bul","🎓 Bulletins"],["set","⚙️ Paramètres"],["arch","📚 Archives"],["help","🆘 Aide"]];
function head(){const tabs=AUTH?TABS.filter(t=>t[0]!="adm"||ADMIN):[];$("#tabs").innerHTML=tabs.map(t=>`<button class="${T==t[0]?"on":""}" onclick="T='${t[0]}';render()">${t[1]}</button>`).join("")+(AUTH?`<span style="margin-left:auto;font-size:12px">${ADMIN?"👑 ":"👤 "}${esc(WHO)}${LOCK?" · "+(LVL||NM[LOCK]):""}</span><button class="g" onclick="logout()">⏻ Quitter</button>`:"");
$("#kb").innerHTML=["cp","cm"].map(k=>LOCK&&k!=LOCK?`<button class="g" disabled style="opacity:.45">🔒 ${NM[k]}</button>`:`<button class="${K==k?"on":"g"}" ${LOCK?"disabled":""} onclick="K='${k}';BID=null;render()">${NM[k]}</button>`).join(" ");
$("#cb").innerHTML=[1,2,3,4].map(c=>`<button class="${C==c?"on":"g"}" onclick="C=${c};render()">${c}</button>`).join(" ");
$("#cw").style.display=$("#cb").style.display=(T=="eval")?"":"none";$("#kb").parentElement.style.display=(!AUTH||T=="set"||T=="home"||T=="adm"||T=="help"||T=="arch")?"none":""}
function rHome(){const b=(k,t)=>LOCK&&k!=LOCK?`<button class="g" disabled style="opacity:.45">🔒 ${t}</button>`:`<button onclick="K='${k}';T='eval';render()">📝 ${t}</button>`;$("#m").innerHTML=`<div class="card" style="text-align:center;padding:24px 12px"><img src="${HOMELOGO}" alt="Logo" style="width:min(300px,70vw);height:auto"><h2 style="margin:10px 0 4px">Bulletin de notes</h2><p style="color:var(--mu);margin:0 0 16px">Pour les enseignants du préscolaire et primaire<br><i>Évaluer · Accompagner · Réussir</i></p><div class="bar" style="justify-content:center">${b("cp","Évaluation CP")}${b("cm","Évaluation CE - CM")}<button onclick="T='ann';render()">📊 Moyenne annuelle</button><button onclick="T='bul';render()">🎓 Bulletins</button><button class="g" onclick="T='set';render()">⚙️ Paramètres</button><button onclick="T='arch';render()">📚 Archives</button><button class="g" onclick="T='help';render()">🆘 Aide</button>${ADMIN?'<button class="d" onclick="T=\'adm\';render()">🔑 Administration</button>':""}</div></div>`}
function render(){offB();showAnn();if(AUTH&&!ADMIN&&EXPN!=null&&EXPN<todayN()){toast("Votre code d’accès a expiré.");lss("acc",null);AUTH=false;LOCK=LVL=null}if(!AUTH){head();T=="help"?rHelp():rLogin();return}if(LOCK)K=LOCK;if(T=="adm"&&!ADMIN)T="home";head();({home:rHome,eval:rEval,ann:rAnn,bul:rBul,set:rSet,adm:rAdmin,help:rHelp,arch:rArch})[T]()}
/* ---------- évaluation mensuelle ---------- */
function rowH(s,i,k){const sb=SUB[k],n=s.n[C]||[];return `<tr data-i="${i}" class="${s.sexe=="F"?"f":""}"><td class="rg n1"></td><td><input class="nm" value="${esc(s.nom)}" placeholder="Nom et prénoms"></td><td><input class="sx" maxlength="1" value="${s.sexe}"></td>${sb.map((_,j)=>`<td><input class="nt" data-j="${j}" inputmode="decimal" value="${n[j]==null?"":fm(n[j])}"></td>`).join("")}<td class="tot"></td><td class="moy"></td><td class="ap"></td><td><input type="checkbox" class="ab" ${s.abs[C]?"checked":""}></td><td class="idc"></td><td><button class="g" data-del>✕</button></td></tr>`}

function payWin(id){const d=fd(id),P=PAYC();if(!d)return;const L=[["Wave",P.wave],["Orange Money",P.om],["MTN Money",P.mtn]];modal(`<div class="bar" style="justify-content:space-between"><b>⬇ ${esc(d.titre)}</b><button class="g" onclick="closeModal()">✕ Fermer</button></div><p>Montant à payer : <b>${P.prix} FCFA</b></p>${L.map(x=>`<div class="bar" style="margin:4px 0"><span style="flex:1"><b>${x[0]}</b> : ${x[1]}</span><button class="g" onclick="payCopy('${x[1]}')">Copier</button></div>`).join("")}<ol style="color:var(--mu);padding-left:18px"><li>Payez ${P.prix} FCFA à l’un des numéros ci-dessus.</li><li>Notez la référence de transaction reçue par SMS.</li><li>Envoyez la preuve à l’administrateur.</li><li>Saisissez le code de déblocage reçu : le téléchargement démarre, puis le document se verrouille.</li></ol><div class="fm"><div><label>Moyen de paiement</label><select id="po1" style="width:100%;padding:8px"><option>Wave</option><option>Orange Money</option><option>MTN Money</option></select></div><div><label>Référence de la transaction</label><input id="pr1"></div></div><div class="bar" style="margin:8px 0"><button class="w" onclick="payProof('${d.id}','wa')">Envoyer la preuve (WhatsApp)</button><button class="g" onclick="payProof('${d.id}','mail')">✉ E-mail</button></div><label>Code de déblocage</label><input id="uc" placeholder="DLxxxxx-XXXXXXXX" style="width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);text-transform:uppercase"><div class="bar" style="margin-top:8px"><button onclick="unlockDoc('${d.id}')">🔓 Débloquer et télécharger</button></div>`)}

async function unlockDoc(id){const d=fd(id),code=$("#uc").value.toUpperCase().replace(/\s/g,""),m=/^DL([A-Z2-7]{2})([A-Z2-7]{3})-([A-Z2-7]{8})$/.exec(code);if(!m)return toast("Code de déblocage invalide.");const no=(B32.indexOf(m[1][0])<<5)|B32.indexOf(m[1][1]);if(no!=d.no)return toast("Ce code correspond à un autre document.");if(usedG().includes(no+"|"+m[2]))return toast("Ce code a déjà été utilisé : le document est verrouillé.");if((await hm("dl|"+no+"|"+DEV+"|"+m[2])).slice(0,8)!=m[3])return toast("Code incorrect ou généré pour un autre appareil.");const ok=dlokG();ok[no]=m[2];lss("dlok",JSON.stringify(ok));closeModal();dlDoc(id)}

async function ghPut(path,b64,msg){const g=JSON.parse(lsg("gh")||"{}");if(!g.repo||!g.token)throw new Error("GitHub non configuré (section Publication GitHub de l’annonce)");const api="https://api.github.com/repos/"+g.repo+"/contents/"+path,h={Authorization:"Bearer "+g.token,Accept:"application/vnd.github+json"},br=g.branch||"main";let sha;const r=await fetch(api+"?ref="+br,{headers:h});if(r.ok)sha=(await r.json()).sha;const b=await fetch(api,{method:"PUT",headers:h,body:JSON.stringify({message:msg,content:b64,branch:br,sha})});if(!b.ok)throw new Error("GitHub "+b.status);return"https://raw.githubusercontent.com/"+g.repo+"/"+br+"/"+path}
const b64u=s=>btoa(unescape(encodeURIComponent(s))),b64f=f=>new Promise((a,z)=>{const r=new FileReader();r.onload=()=>a(r.result.split(",")[1]);r.onerror=z;r.readAsDataURL(f)});

<b style="display:block;margin-top:12px">Valider un paiement et débloquer un téléchargement</b><div class="fm"><div><label>Document</label><select id="pd" style="width:100%;padding:8px">${S.arch.map(d=>`<option value="${d.id}">${esc(d.titre)}</option>`).join("")}</select></div><div><label>Code appareil de l’utilisateur</label><input id="pv" placeholder="AP-XXXX-XXXX" style="text-transform:uppercase"></div><div><label>Moyen de paiement</label><select id="po2" style="width:100%;padding:8px"><option>Wave</option><option>Orange Money</option><option>MTN Money</option></select></div><div><label>Référence de la transaction</label><input id="pr"></div><div><label>Montant reçu (FCFA)</label><input id="pa" value="${pc.prix}"></div></div><div class="bar" style="margin-top:8px"><button onclick="payOk()">✅ Valider le paiement et générer le code</button></div><p style="color:var(--mu)">Vérifiez le paiement dans votre compte Wave, Orange Money ou MTN avant de valider. Chaque code est à usage unique et valable seulement sur l’appareil indiqué.</p><div class="sc"><table><thead><tr><th>Date</th><th>Document</th><th>Moyen</th><th>Référence</th><th>FCFA</th><th>Code</th><th></th></tr></thead><tbody>${S.pay.map((p,i)=>`<tr><td>${p.date}</td><td style="text-align:left">${esc(p.doc)}</td><td>${esc(p.op)}</td><td>${esc(p.ref)}</td><td>${p.amt}</td><td><b style="font:bold 13px monospace">${p.code}</b></td><td><button class="w" onclick="payWa(${i})">WhatsApp</button> <button class="g" onclick="payCp(${i})">Copier</button></td></tr>`).join("")||"<tr><td colspan=7>Aucun paiement enregistré.</td></tr>"}</tbody></table></div><div class="st" style="margin-top:8px"><div>Total encaissé<b>${tot}</b></div><div>Wave<b>${by("Wave")}</b></div><div>Orange Money<b>${by("Orange Money")}</b></div><div>MTN Money<b>${by("MTN Money")}</b></div></div></div>`}

async function rAdmin(){if(!ADMIN){T="home";return render()}const us=S.users,cd=await Promise.all(us.map(mkCode)),tn=todayN();$("#m").innerHTML=`<div class="card"><b>Générer un code d’accès</b><p style="color:var(--mu)">Le code est lié au nom, prénom, e-mail, à une classe, au <b>code appareil</b> fourni par l’utilisateur et à une <b>date de fin de validité</b>. Régénérer un code rend l’ancien inutilisable ; un code expiré ne fonctionne plus sur aucun appareil.</p><div class="fm"><div><label>Nom</label><input id="an"></div><div><label>Prénoms</label><input id="ap"></div><div><label>E-mail</label><input id="ae" type="email"></div><div><label>Classe</label><select id="ac" style="width:100%;padding:8px"><option value="CP1">CP1</option><option value="CP2">CP2</option><option value="CE1">CE1</option><option value="CE2">CE2</option><option value="CM1">CM1</option><option value="CM2">CM2</option></select></div><div><label>Code appareil de l’utilisateur (AP-XXXX-XXXX)</label><input id="ad" placeholder="AP-XXXX-XXXX" style="text-transform:uppercase"></div><div><label>Valide jusqu’au (inclus)</label><input id="ax" type="date"></div><div><label>Durée rapide</label><select id="aq" onchange="qd()" style="width:100%;padding:8px"><option value="">—</option><option value="1">1 mois</option><option value="3">3 mois</option><option value="6">6 mois</option><option value="12">1 an</option></select></div></div><div class="bar" style="margin-top:8px"><button onclick="genU()">🔑 Générer / régénérer le code</button></div></div><div class="card sc"><table><thead><tr><th>Utilisateur</th><th>E-mail</th><th>Classe</th><th>Appareil</th><th>Expire le</th><th>État</th><th>Code actuel</th><th></th></tr></thead><tbody>${us.map((u,i)=>{const n=isoN(u.exp),st=!cd[i]?"À régénérer":n<tn?"⛔ Expiré":"✅ Actif";return `<tr><td style="text-align:left">${esc(u.nom+" "+u.prenom)}</td><td>${esc(u.email)}</td><td>${u.classe}</td><td class="idc">${esc(u.dev||"—")}</td><td>${isNaN(n)?"—":nFr(n)}</td><td>${st}</td>
