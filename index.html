const SUB={cp:["Écriture","Copie","Orthographe","Expression écrite","Mathématiques","EDHC","Chant / Dessin","Dictée / Graphisme"],cm:["Étude de texte","Éveil au milieu","Dictée","Mathématiques"]};

const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S,K="cp",C=1,T="home",BID=null,SORT=false;
const blank=()=>({id:"",nom:"",sexe:"",abs:{},n:{},ov:{}});
const def=()=>({set:{ecole:"",annee:"",iepp:"IEPP GUIGLO",bp:"",email:"",dir:"",dt:"",cp:{cl:"CP1",m:"",t:""},cm:{cl:"CM1",m:"",t:""}},cp:Array.from({length:10},blank),cm:Array.from({length:10},blank)});
/* stockage IndexedDB + secours localStorage */
let db;const idb=()=>new Promise(r=>{try{const q=indexedDB.open("bulletins",2);q.onupgradeneeded=()=>{const d=q.result;if(!d.objectStoreNames.contains("k"))d.createObjectStore("k");if(!d.objectStoreNames.contains("docs"))d.createObjectStore("docs")};q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}});
const dbGet=()=>new Promise(r=>{if(!db){try{r(JSON.parse(localStorage.getItem("bul")))}catch(e){r(null)}return}const q=db.transaction("k").objectStore("k").get("S");q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)});
let tm;const save=()=>{clearTimeout(tm);tm=setTimeout(()=>{try{if(db)db.transaction("k","readwrite").objectStore("k").put(S,"S");else localStorage.setItem("bul",JSON.stringify(S))}catch(e){}},300)};
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",3500)}
const named=k=>S[k].filter(s=>s.nom.trim());
const fm=x=>x==null?"":(Math.round(x*100)/100).toString().replace(".",",");
const num=v=>{v=String(v).replace(",",".").trim();if(v==="")return null;const x=parseFloat(v);return isNaN(x)?null:Math.max(0,Math.min(10,x))};
function calc(s,k,c){const a=(s.n[c]||[]).slice(0,SUB[k].length).filter(x=>x!=null&&x!=="");const tot=a.reduce((p,x)=>p+x,0);return{has:a.length>0,tot:a.length?tot:null,moy:a.length?tot/a.length:null}}
const appr=m=>m==null?"":m>=10?"Très bien":m>=8?"Bien":m>=6?"Assez bien":m>=5?"Passable":m>=3?"Insuffisant":"Faible";
function ranks(k,f){const l=named(k).map(s=>({s,m:f(s)})).filter(x=>x.m!=null).sort((a,b)=>b.m-a.m);const r={};l.forEach(x=>r[x.s.id]=1+l.filter(y=>y.m>x.m).length);return{r,n:l.length}}
const rk=n=>n?n+(n==1?"er":"e"):"";
function ann(s,k){const c=[1,2,3,4].map(i=>s.ov[i]!=null&&s.ov[i]!==""?num(s.ov[i]):calc(s,k,i).moy);const has=c.every(x=>x!=null);const v=c.map(x=>x||0);const tot=v[0]+v[1]+v[2]+v[3]*2,moy=tot/5;return{c,has,tot:has?tot:null,moy:has?moy:null,dfa:!has?"":moy<5?"REDOUBLE":moy>=10?"Très-Bien":"ADMIS"}}
function genId(k){let id;const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";do{id=(k=="cp"?"CP":"CM")+"-"+Array.from({length:6},()=>A[Math.random()*A.length|0]).join("")}while(["cp","cm"].some(q=>S[q].some(s=>s.id==id)));return id}
function stats(k,c){const L=named(k),o={};["M","F"].forEach(x=>{const g=L.filter(s=>s.sexe==x),p=g.filter(s=>!s.abs[c]&&calc(s,k,c).has);const ad=p.filter(s=>calc(s,k,c).moy>=5).length;o[x]={i:g.length,p:p.length,a:g.length-p.length,ad,pc:p.length?ad/p.length*100:null}});const t={};["i","p","a","ad"].forEach(f=>t[f]=o.M[f]+o.F[f]);t.pc=t.p?t.ad/t.p*100:null;const ms=L.filter(s=>!s.abs[c]&&calc(s,k,c).has).map(s=>calc(s,k,c).moy);return{o,t,max:ms.length?Math.max(...ms):null,min:ms.length?Math.min(...ms):null,avg:ms.length?ms.reduce((a,b)=>a+b,0)/ms.length:null}}

async function payOk(){const d=S.arch.find(x=>x.id==$("#pd").value),dev=$("#pv").value.trim().toUpperCase(),ref=$("#pr").value.trim(),op=$("#po2").value,amt=+$("#pa").value;if(!d)return toast("Ajoutez d’abord un document.");if(!/^AP-[A-Z2-7]{4}-[A-Z2-7]{4}$/.test(dev))return toast("Code appareil invalide (AP-XXXX-XXXX).");if(!ref||!(amt>0))return toast("Référence et montant obligatoires.");if(S.pay.some(p=>p.ref.toLowerCase()==ref.toLowerCase()&&p.op==op)&&!confirm("Cette référence est déjà enregistrée. Continuer ?"))return;const code=await mkDL(d,dev);S.pay.unshift({date:nIso(todayN()),doc:d.titre,no:d.no,op,ref,amt,dev,code});save();await rAdmin();toast("Code de déblocage : "+code)}
async function payCp(i){try{await navigator.clipboard.writeText(S.pay[i].code);toast("Code copié.")}catch(e){toast(S.pay[i].code)}}
function payWa(i){const p=S.pay[i];open("https://wa.me/?text="+encodeURIComponent(`Paiement reçu, merci. Votre code de déblocage pour « ${p.doc} » : ${p.code}\nÀ saisir dans Archives → Télécharger. Usage unique, valable uniquement sur votre appareil.`))}

function offB(){const e=$("#offb");if(e)e.innerHTML=navigator.onLine?"":'<div style="background:#444;color:#fff;text-align:center;padding:5px;font-size:12px">📴 Mode hors ligne : vos données restent disponibles sur l’appareil</div>'}
function printBul(){const s=named(K).find(x=>x.id==BID);if(!s)return;let z=$("#pz");if(!z){z=document.createElement("div");z.id="pz";document.body.appendChild(z)}z.innerHTML=`<div class="bl">${bulHTML(s,K)}</div>`;toast("Dans la fenêtre d’impression, choisissez « Enregistrer au format PDF ».");setTimeout(()=>{print();setTimeout(()=>z.remove(),800)},700)}

/* ---------- impression, aperçu, PDF robuste ---------- */
const capP=n=>{try{return(Capacitor.Plugins&&Capacitor.Plugins[n])||Capacitor.registerPlugin(n)}catch(e){return null}};
function sheetHTML(k){const sb=SUB[k],L=named(k),R=ranks(k,s=>s.abs[C]?null:calc(s,k,C).moy),st=stats(k,C),o=st.o,f=v=>v==null?"":fm(v);return `<div class="shp"><h3>FEUILLE D’ÉVALUATION — ${NM[k]} (${esc(S.set[k].cl)}) — COMPOSITION ${C}</h3><div style="margin-bottom:6px">${esc(S.set.ecole)} ${esc(S.set.annee)} | Tenant(e) : ${esc(S.set[k].m)}</div><table><thead><tr><th>Rang</th><th>NOM ET PRÉNOMS</th><th>S</th>${sb.map(x=>`<th>${x}</th>`).join("")}<th>Total</th><th>Moy.</th><th>Appréciation</th><th>ID</th></tr></thead><tbody>${L.map(s=>{const c=calc(s,k,C),sh=c.has&&!s.abs[C];return `<tr><td>${sh?rk(R.r[s.id]):""}</td><td style="text-align:left;${s.sexe=="F"?"color:#d0021b;font-weight:bold":""}">${esc(s.nom)}</td><td>${s.sexe}</td>${sb.map((_,j)=>`<td>${fm((s.n[C]||[])[j])}</td>`).join("")}<td>${sh?fm(c.tot):""}</td><td>${sh?fm(c.moy):""}</td><td>${s.abs[C]?"Absent(e)":sh?appr(c.moy):""}</td><td>${s.id}</td></tr>`}).join("")}</tbody></table><table style="width:60%;margin-top:8px"><tr><th></th><th>Garçons</th><th>Filles</th><th>Total</th></tr><tr><th>INSCRITS</th><td>${o.M.i}</td><td>${o.F.i}</td><td>${st.t.i}</td></tr><tr><th>PRÉSENTS</th><td>${o.M.p}</td><td>${o.F.p}</td><td>${st.t.p}</td></tr><tr><th>ABSENTS</th><td>${o.M.a}</td><td>${o.F.a}</td><td>${st.t.a}</td></tr><tr><th>ADMIS</th><td>${o.M.ad}</td><td>${o.F.ad}</td><td>${st.t.ad}</td></tr><tr><th>% ADMIS</th><td>${f(o.M.pc)}</td><td>${f(o.F.pc)}</td><td>${f(st.t.pc)}</td></tr><tr><th>Moy. élevée / classe / faible</th><td>${f(st.max)}</td><td>${f(st.avg)}</td><td>${f(st.min)}</td></tr></table></div>`}
function annHTML(k){const L=named(k),R=ranks(k,s=>ann(s,k).moy);return `<div class="shp"><h3>MOYENNE GÉNÉRALE ANNUELLE — ${NM[k]}</h3><table><thead><tr><th>Rang</th><th>NOM ET PRÉNOMS</th><th>S</th><th>C1</th><th>C2</th><th>C3</th><th>C4</th><th>TOTAL</th><th>MOY</th><th>DFA</th><th>ID</th></tr></thead><tbody>${L.map(s=>{const a=ann(s,k);return `<tr><td>${a.has?rk(R.r[s.id]):""}</td><td style="text-align:left;${s.sexe=="F"?"color:#d0021b;font-weight:bold":""}">${esc(s.nom)}</td><td>${s.sexe}</td>${a.c.map(x=>`<td>${fm(x)}</td>`).join("")}<td>${fm(a.tot)}</td><td>${fm(a.moy)}</td><td>${a.dfa}</td><td>${s.id}</td></tr>`}).join("")}</tbody></table></div>`}
function docHTML(kind){if(kind=="eval")return sheetHTML(K);if(kind=="ann")return annHTML(K);const s=named(K).find(x=>x.id==BID);return s?`<div class="bl">${bulHTML(s,K)}</div>`:"<p>Aucun bulletin.</p>"}
function printHTML(h){let z=$("#pz");if(!z){z=document.createElement("div");z.id="pz";document.body.appendChild(z)}z.innerHTML=h;setTimeout(async()=>{try{if(NAT())await capP("AppPrint").print({name:"SMART BNEPP"});else print()}catch(e){toast("Impression impossible : "+((e&&e.message)||e))}setTimeout(()=>{const q=$("#pz");if(q)q.remove()},2000)},500)}
function printDoc(kind){closeModal();printHTML(docHTML(kind))}
function previewDoc(kind){const h=docHTML(kind);modal(`<div class="bar" style="justify-content:space-between;margin-bottom:8px"><b>👁 Aperçu avant impression</b><span><button onclick="printDoc('${kind}')">🖨 Imprimer</button> <button class="g" onclick="closeModal()">✕ Fermer</button></span></div><div style="overflow:auto;background:#888;padding:6px;border-radius:8px"><div style="zoom:${kind=="bul"?Math.min(1,(Math.min(innerWidth,760)-50)/794):1}">${h}</div></div>`)}
async function bulPdf(mode){if(!pdfOK()){printDoc("bul");return}try{await bulPdf0(mode)}catch(e){toast("PDF impossible ("+((e&&e.message)||e)+") : ouverture de l’impression…");setTimeout(()=>printDoc("bul"),1500)}}
function sheetPdf(mode){if(!pdfOK()){printDoc("eval");return}try{sheetPdf0(mode)}catch(e){toast("PDF impossible ("+((e&&e.message)||e)+") : ouverture de l’impression…");setTimeout(()=>printDoc("eval"),1500)}}
function annPdf(){if(!pdfOK()){printDoc("ann");return}try{annPdf0()}catch(e){toast("PDF impossible ("+((e&&e.message)||e)+") : ouverture de l’impression…");setTimeout(()=>printDoc("ann"),1500)}}
async function rAdmin(){if(!ADMIN){T="home";return render()}const us=S.users,cd=await Promise.all(us.map(mkCode)),tn=todayN();$("#m").innerHTML=`<div class="card"><b>Générer un code d’accès</b><p style="color:var(--mu)">Le code est lié au nom, prénom, e-mail, à une classe, au <b>code appareil</b> fourni par l’utilisateur et à une <b>date de fin de validité</b>. Régénérer un code rend l’ancien inutilisable ; un code expiré ne fonctionne plus sur aucun appareil.</p><div class="fm"><div><label>Nom</label><input id="an"></div><div><label>Prénoms</label><input id="ap"></div><div><label>E-mail</label><input id="ae" type="email"></div><div><label>Classe</label><select id="ac" style="width:100%;padding:8px"><option value="CP1">CP1</option><option value="CP2">CP2</option><option value="CE1">CE1</option><option value="CE2">CE2</option><option value="CM1">CM1</option><option value="CM2">CM2</option></select></div><div><label>Code appareil de l’utilisateur (AP-XXXX-XXXX)</label><input id="ad" placeholder="AP-XXXX-XXXX" style="text-transform:uppercase"></div><div><label>Valide jusqu’au (inclus)</label><input id="ax" type="date"></div><div><label>Durée rapide</label><select id="aq" onchange="qd()" style="width:100%;padding:8px"><option value="">—</option><option value="1">1 mois</option><option value="3">3 mois</option><option value="6">6 mois</option><option value="12">1 an</option></select></div></div><div class="bar" style="margin-top:8px"><button onclick="genU()">🔑 Générer / régénérer le code</button></div></div><div class="card sc"><table><thead><tr><th>Utilisateur</th><th>E-mail</th><th>Classe</th><th>Appareil</th><th>Expire le</th><th>État</th><th>Code actuel</th><th></th></tr></thead><tbody>${us.map((u,i)=>{const n=isoN(u.exp),st=!cd[i]?"À régénérer":n<tn?"⛔ Expiré":"✅ Actif";return `<tr><td style="text-align:left">${esc(u.nom+" "+u.prenom)}</td><td>${esc(u.email)}</td><td>${u.classe}</td><td class="idc">${esc(u.dev||"—")}</td><td>${isNaN(n)?"—":nFr(n)}</td><td>${st}</td><td><b style="font:bold 14px monospace">${cd[i]||"—"}</b></td><td><button onclick="editU(${i})">↻ Régénérer</button> <button class="w" onclick="shU(${i})">WhatsApp</button> <button class="g" onclick="cpU(${i})">Copier</button> <button class="d" onclick="delU(${i})">✕</button></td></tr>`}).join("")||"<tr><td colspan=8>Aucun utilisateur.</td></tr>"}</tbody></table></div>${annCard()}${archCard()}<div class="card"><b>Mot de passe administrateur</b><div class="fm"><div><label>Nouveau mot de passe (6 caractères min.)</label><input id="p1" type="password"></div><div><label>Confirmer</label><input id="p2" type="password"></div></div><div class="bar" style="margin-top:8px"><button onclick="chPw()">Modifier le mot de passe</button></div></div>`}
function qd(){const n=+$("#aq").value;if(!n)return;const d=new Date();d.setMonth(d.getMonth()+n);$("#ax").value=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
async function genU(){const u={nom:$("#an").value.trim(),prenom:$("#ap").value.trim(),email:$("#ae").value.trim(),classe:$("#ac").value,dev:$("#ad").value.toUpperCase().replace(/\s/g,""),exp:$("#ax").value};if(!u.nom||!u.prenom||!/\S+@\S+\.\S+/.test(u.email))return toast("Nom, prénom et e-mail valide obligatoires.");if(!/^AP-[A-Z2-7]{4}-[A-Z2-7]{4}$/.test(u.dev))return toast("Code appareil invalide (format AP-XXXX-XXXX).");const n=isoN(u.exp);if(isNaN(n)||n<todayN())return toast("Choisissez une date de fin de validité à venir.");const e=S.users.find(x=>idk(x,x.classe)==idk(u,u.classe));let t;if(e){e.v++;e.dev=u.dev;e.exp=u.exp;t=e}else{t={...u,v:1};S.users.push(t)}save();await rAdmin();toast("Code : "+await mkCode(t)+" (valide jusqu’au "+nFr(n)+")")}
function editU(i){const u=S.users[i];$("#an").value=u.nom;$("#ap").value=u.prenom;$("#ae").value=u.email;$("#ac").value=u.classe;$("#ad").value=u.dev||"";$("#ax").value=u.exp||"";scrollTo(0,0);toast("Modifiez l’appareil ou la date, puis cliquez sur « Générer / régénérer ».")}
async function cpU(i){const c=await mkCode(S.users[i]);if(!c)return toast("Régénérez d’abord ce code.");try{await navigator.clipboard.writeText(c);toast("Code copié : "+c)}catch(e){toast("Code : "+c)}}
async function shU(i){const u=S.users[i],c=await mkCode(u);if(!c)return toast("Régénérez d’abord ce code.");open("https://wa.me/?text="+encodeURIComponent(`Bonjour ${u.prenom}, voici votre code d’accès à l’application SMART BNEPP (${u.classe}) : ${c}\nValable jusqu’au ${nFr(isoN(u.exp))}, uniquement sur l’appareil ${u.dev}.`))}
function delU(i){if(confirm("Supprimer cet utilisateur de la liste ?")){S.users.splice(i,1);save();rAdmin()}}
async function chPw(){const a=$("#p1").value;if(a.length<6||a!=$("#p2").value)return toast("Mot de passe trop court ou confirmation différente.");lss("adm",await sha(a));$("#p1").value=$("#p2").value="";toast("Mot de passe administrateur modifié.")}
(async()=>{await idb();S=(await dbGet())||def();S.users=S.users||[];S.arch=S.arch||[];S.pay=S.pay||[];S.pc=S.pc||{...PAY0};S.users.forEach(u=>{if(u.classe=="cp")u.classe="CP1";if(u.classe=="cm")u.classe="CE1"});if(ssg()=="1"){AUTH=ADMIN=true;WHO="Administrateur"}else{try{const a=JSON.parse(lsg("acc"));if(a){const r=await chk(a,a.code,a.classe);if(typeof r=="object"){AUTH=true;EXPN=r.exp;LOCK=K=grp(a.classe);LVL=a.classe;WHO=a.prenom+" "+a.nom}else{lss("acc",null);setTimeout(()=>toast(r),500)}}}catch(e){}}render();chkAll()})();addEventListener("online",()=>{offB();chkAll()});addEventListener("offline",offB);setInterval(chkAll,18e5);
</script></body></html>
